[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plangenius-ai"
version = "1.0.0"
description = "GenAI-Powered Event Planning Assistant for Weddings, Birthdays & Community Events"
readme = "README.md"
authors = [{ name = "Sudhanshu Sharma", email = "sudhanshusharma30544@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "Flask>=2.2.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "test_backend.py",
    "test_integration.py",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312", "py313"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
